[workspace]
members = ["sm-logic"]

[package]
name = "sm-json-data"
version = "0.1.0"
edition = "2021"
description = "Parses sm-json-data and builds the sm-logic model of Super Metroid's logic"
license = "0BSD"
repository = "https://github.com/JimLundin/sm-json-data-rs"
keywords = ["super-metroid", "randomizer", "serde"]
publish = false

[dependencies]
sm-logic = { path = "sm-logic", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xz2 = { version = "0.1", features = ["static"] }
serde_with = { version = "3", default-features = false, features = ["macros"] }
