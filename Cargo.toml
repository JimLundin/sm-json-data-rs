[package]
name = "sm-json-data"
version = "0.1.0"
edition = "2021"
description = "Typed Rust bindings for the sm-json-data Super Metroid logic model"
repository = "https://github.com/JimLundin/sm-json-data-rs"
keywords = ["super-metroid", "randomizer", "serde"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
